services:
  - type: web
    name: edustacked
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://edustacked-production.up.railway.app/api/*
      - type: rewrite
        source: /*
        destination: /index.html
