name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      continue-on-error: false

    - name: Run backend tests
      run: |
        cd backend
        pytest --tb=short --cov=apps --cov-fail-under=50 -v
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'staging-key-change-in-staging' }}
        DJANGO_ALLOWED_HOSTS: staging.example.com,localhost
        DJANGO_CORS_ALLOWED_ORIGINS: https://staging.example.com,http://localhost:5173
        DATABASE_URL: sqlite:///test_db.sqlite3

    - name: Run backend linting
      run: |
        flake8 backend/apps --count --statistics
        black --check backend/apps
        isort --check-only backend/apps
      continue-on-error: true

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend
      continue-on-error: false

    - name: Run frontend tests
      run: npm run test -- --run
      working-directory: frontend
      continue-on-error: true

    - name: Build frontend
      run: npm run build
      working-directory: frontend
      env:
        NODE_ENV: staging
        VITE_API_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:8000/api' }}

    - name: Verify frontend build
      run: |
        if [ ! -d "frontend/dist" ]; then
          echo "❌ Frontend build failed - dist directory not found"
          exit 1
        fi
        echo "✅ Frontend build verified"

    - name: Run database migrations
      run: |
        cd backend
        python manage.py migrate --noinput --verbosity 2
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'staging-key-change-in-staging' }}
        DJANGO_ALLOWED_HOSTS: staging.example.com,localhost
        DJANGO_CORS_ALLOWED_ORIGINS: https://staging.example.com,http://localhost:5173
        DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///db.sqlite3' }}

    - name: Collect static files
      run: |
        cd backend
        python manage.py collectstatic --noinput --verbosity 2
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'staging-key-change-in-staging' }}
      continue-on-error: false

    - name: Build status check
      run: echo "✅ All staging deployment checks passed!"

    - name: Deploy notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          🚀 Staging Deployment: ${{ job.status }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      continue-on-error: true
