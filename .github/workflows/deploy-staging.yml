name: Staging Validation

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      continue-on-error: false

    - name: Run backend tests
      run: |
        cd backend
        pytest --tb=short --cov=apps --cov-fail-under=50 -v
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ci-staging-only-secret-not-for-deployment
        DJANGO_ALLOWED_HOSTS: staging.example.com,localhost
        DJANGO_CORS_ALLOWED_ORIGINS: https://staging.example.com,http://localhost:5173
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run backend linting
      run: |
        flake8 backend/apps --count --statistics
        black --check backend/apps
        isort --check-only backend/apps
      continue-on-error: true

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend
      continue-on-error: false

    - name: Run frontend tests
      run: npm run test --if-present -- --run
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend
      env:
        NODE_ENV: staging
        VITE_API_BASE_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:8000/api' }}

    - name: Verify frontend build
      run: |
        if [ ! -d "frontend/dist" ]; then
          echo "❌ Frontend build failed - dist directory not found"
          exit 1
        fi
        echo "✅ Frontend build verified"

    - name: Run database migrations
      run: |
        cd backend
        python manage.py migrate --noinput --verbosity 2
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ci-staging-only-secret-not-for-deployment
        DJANGO_ALLOWED_HOSTS: staging.example.com,localhost
        DJANGO_CORS_ALLOWED_ORIGINS: https://staging.example.com,http://localhost:5173
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Collect static files
      run: |
        cd backend
        python manage.py collectstatic --noinput --verbosity 2
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ci-staging-only-secret-not-for-deployment
      continue-on-error: false

    - name: Build status check
      run: echo "✅ Staging validation checks passed. No hosting deployment target is configured in this workflow."

    - name: Staging validation notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          Staging validation: ${{ job.status }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      continue-on-error: true
