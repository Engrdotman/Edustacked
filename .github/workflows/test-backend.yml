name: Backend Tests & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements-dev.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    - name: Run linting checks
      run: |
        cd backend
        flake8 apps --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 apps --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        black --check apps || true
        isort --check-only apps || true

    - name: Run migrations
      run: |
        cd backend
        python manage.py migrate
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: test-secret-key-change-in-production
        DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
        DJANGO_SETTINGS_MODULE: config.settings
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run tests with coverage
      run: |
        cd backend
        pytest --cov=apps --cov-report=xml --cov-report=html --cov-fail-under=50
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: test-secret-key-change-in-production
        DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
        DJANGO_SETTINGS_MODULE: config.settings
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
      continue-on-error: true

