name: Production Build and Release

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      continue-on-error: false

    - name: Run backend tests with coverage
      run: |
        cd backend
        pytest --tb=short --cov=apps --cov-fail-under=50 -v --junitxml=junit.xml
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: test-secret-key-prod
        DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: backend/junit.xml

    - name: Run backend linting
      run: |
        flake8 backend/apps --count --statistics
        black --check backend/apps
        isort --check-only backend/apps
      continue-on-error: false

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend
      continue-on-error: false

    - name: Build frontend
      run: npm run build
      working-directory: frontend
      env:
        NODE_ENV: production
        VITE_API_BASE_URL: /api

    - name: Verify frontend build
      run: |
        if [ ! -d "frontend/dist" ]; then
          echo "❌ Frontend build failed - dist directory not found"
          exit 1
        fi
        echo "✅ Frontend build verified"
        du -sh frontend/dist

    - name: Run database migrations dry-run
      run: |
        cd backend
        python manage.py migrate --plan --verbosity 2
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
        DJANGO_CORS_ALLOWED_ORIGINS: ${{ secrets.DJANGO_CORS_ALLOWED_ORIGINS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    if: success()

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Validate secrets
      env:
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        if [ -z "$DJANGO_SECRET_KEY" ]; then
          echo "❌ DJANGO_SECRET_KEY not configured"
          exit 1
        fi
        if [ -z "$DATABASE_URL" ]; then
          echo "❌ DATABASE_URL not configured"
          exit 1
        fi
        echo "✅ Required secrets are configured"

    - name: Install backend dependencies
      run: |
        pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Build frontend artifacts
      run: |
        npm ci
        npm run build
      working-directory: frontend
      env:
        NODE_ENV: production
        VITE_API_BASE_URL: /api

    - name: Run database migrations
      run: |
        cd backend
        echo "Starting database migrations..."
        python manage.py migrate --noinput --verbosity 2
        echo "✅ Migrations completed successfully"
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
        DJANGO_CORS_ALLOWED_ORIGINS: ${{ secrets.DJANGO_CORS_ALLOWED_ORIGINS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Collect static files
      run: |
        cd backend
        python manage.py collectstatic --noinput --verbosity 2
        echo "✅ Static files collected"
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    - name: Prepare production package
      run: |
        mkdir -p deployment
        cp -r frontend/dist deployment/frontend
        cp -r backend/apps deployment/backend-apps
        cp backend/manage.py deployment/
        cp backend/config deployment/ -r
        cp backend/requirements.txt deployment/
        cp -r backend/staticfiles deployment/ 2>/dev/null || true
        echo "✅ Production package prepared. No hosting provider is configured, so this workflow publishes a package instead of deploying it."

    - name: Create production release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ github.run_number }}
        name: Validated Release v${{ github.run_number }}
        token: ${{ secrets.GITHUB_TOKEN }}
        files: deployment/**
        body: |
          ## Validated application release
          
          **Commit:** ${{ github.sha }}
          **Author:** ${{ github.actor }}
          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ### Changes
          - Updated backend code
          - Updated frontend code
          - Ran database migrations
          - Collected static files
          
          ### Validation
          - Backend tests and production build passed
          - Database migration plan checked
          - Package attached to this release

          A hosting provider is not configured in this repository, so publishing this release does not deploy the application.
        draft: false
        prerelease: false

    - name: Notify Slack on success
      uses: 8398a7/action-slack@v3
      if: success()
      with:
        status: success
        text: |
          🎉 Production Release Published!
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Release: v${{ github.run_number }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      continue-on-error: true

    - name: Notify Slack on failure
      uses: 8398a7/action-slack@v3
      if: failure()
      with:
        status: failure
        text: |
          ❌ Production Release Workflow Failed!
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      continue-on-error: true
