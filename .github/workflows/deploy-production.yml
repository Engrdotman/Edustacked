name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: config.settings

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      continue-on-error: false

    - name: Run backend tests with coverage
      run: |
        cd backend
        pytest --tb=short --cov=apps --cov-fail-under=50 -v --junitxml=junit.xml
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: test-secret-key-prod
        DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
        DATABASE_URL: sqlite:///test_db.sqlite3

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: backend/junit.xml

    - name: Run backend linting
      run: |
        flake8 backend/apps --count --statistics
        black --check backend/apps
        isort --check-only backend/apps
      continue-on-error: false

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend
      continue-on-error: false

    - name: Build frontend
      run: npm run build
      working-directory: frontend
      env:
        NODE_ENV: production
        VITE_API_URL: /api

    - name: Verify frontend build
      run: |
        if [ ! -d "frontend/dist" ]; then
          echo "❌ Frontend build failed - dist directory not found"
          exit 1
        fi
        echo "✅ Frontend build verified"
        du -sh frontend/dist

    - name: Run database migrations dry-run
      run: |
        cd backend
        python manage.py migrate --plan --verbosity 2
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
        DJANGO_CORS_ALLOWED_ORIGINS: ${{ secrets.DJANGO_CORS_ALLOWED_ORIGINS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    if: success()

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Validate secrets
      run: |
        if [ -z "${{ secrets.DJANGO_SECRET_KEY }}" ]; then
          echo "❌ DJANGO_SECRET_KEY not configured"
          exit 1
        fi
        if [ -z "${{ secrets.DATABASE_URL }}" ]; then
          echo "❌ DATABASE_URL not configured"
          exit 1
        fi
        echo "✅ Required secrets are configured"

    - name: Install backend dependencies
      run: |
        pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Build frontend artifacts
      run: |
        npm ci
        npm run build
      working-directory: frontend
      env:
        NODE_ENV: production
        VITE_API_URL: /api

    - name: Run database migrations
      run: |
        cd backend
        echo "Starting database migrations..."
        python manage.py migrate --noinput --verbosity 2
        echo "✅ Migrations completed successfully"
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
        DJANGO_CORS_ALLOWED_ORIGINS: ${{ secrets.DJANGO_CORS_ALLOWED_ORIGINS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Collect static files
      run: |
        cd backend
        python manage.py collectstatic --noinput --verbosity 2
        echo "✅ Static files collected"
      env:
        DJANGO_DEBUG: false
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    - name: Prepare deployment artifacts
      run: |
        mkdir -p deployment
        cp -r frontend/dist deployment/frontend
        cp -r backend/apps deployment/backend-apps
        cp backend/manage.py deployment/
        cp backend/config deployment/ -r
        echo "✅ Artifacts prepared for deployment"

    - name: Deploy to production
      run: |
        echo "🚀 Starting production deployment..."
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        
        # TODO: Add your production deployment logic here
        # Examples:
        # - Push to production server via SSH
        # - Deploy to cloud platform (AWS, GCP, Heroku, etc.)
        # - Update load balancer or reverse proxy
        # - Run smoke tests against production
        
        echo "✅ Production deployment completed"

    - name: Verify deployment
      run: |
        echo "🔍 Running deployment verification..."
        # TODO: Add health checks and verification steps
        # Examples:
        # - curl health endpoint
        # - Check API responsiveness
        # - Verify database connection
        # - Monitor error rates
        echo "✅ Deployment verified successfully"

    - name: Create release tag
      uses: actions/github-script@v7
      with:
        script: |
          const tag = `v${new Date().getFullYear()}.${new Date().getMonth() + 1}.${new Date().getDate()}-${context.runNumber}`;
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/tags/${tag}`,
            sha: context.sha
          });
          console.log(`✅ Created release tag: ${tag}`);

    - name: Create release notes
      uses: actions/create-release@v1
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Production Release v${{ github.run_number }}
        body: |
          ## Production Deployment
          
          **Commit:** ${{ github.sha }}
          **Author:** ${{ github.actor }}
          **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          ### Changes
          - Updated backend code
          - Updated frontend code
          - Ran database migrations
          - Collected static files
          
          ### Deployment Status
          ✅ All tests passed
          ✅ Build successful
          ✅ Production deployment completed
        draft: false
        prerelease: false

    - name: Notify Slack on success
      uses: 8398a7/action-slack@v3
      if: success()
      with:
        status: success
        text: |
          🎉 Production Deployment Successful!
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Release: v${{ github.run_number }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      continue-on-error: true

    - name: Notify Slack on failure
      uses: 8398a7/action-slack@v3
      if: failure()
      with:
        status: failure
        text: |
          ❌ Production Deployment Failed!
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      continue-on-error: true
