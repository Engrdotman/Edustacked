name: Production Build Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'netlify.toml'
      - 'vercel.json'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Vercel and Railway deploy through their Git integrations. This workflow
    # validates the same source before those services build their deployments.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: 'false'
      DJANGO_SECURE_SSL_REDIRECT: 'false'
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      DB_CONN_MAX_AGE: '0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check Django configuration
        working-directory: backend
        run: python manage.py check

      - name: Apply migrations to CI database
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run backend tests
        working-directory: backend
        run: pytest --tb=short --cov=apps --cov-report=xml

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: Install frontend dependencies using the repository root
        run: npm ci --prefix frontend

      - name: Build frontend using the repository root Vercel configuration
        run: npm run build --prefix frontend -- --configLoader runner
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: /api

      - name: Verify Vercel output
        run: test -s frontend/dist/index.html

      - name: Upload Vercel build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
